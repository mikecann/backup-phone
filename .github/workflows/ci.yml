name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Python helpers
        run: python -m unittest discover -s tests -v
      - name: Compile Python helpers
        run: python -m compileall -q get_media_ym.py organize_flat_to_ym.py tests
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Host $_.FullName
              $parseErrors | ForEach-Object { Write-Host $_ }
            }
          }
          if ($failed) { throw "PowerShell parse check failed" }
      - name: Test installer lifecycle
        shell: powershell
        run: .\tests\test_installers.ps1
      - name: Test dependency setup
        shell: powershell
        run: .\tests\test_dependencies.ps1
